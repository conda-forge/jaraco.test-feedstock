{% set name = "jaraco.test" %}
{% set version = "5.7.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/jaraco_test-{{ version }}.tar.gz
  sha256: dd4e17584be825986d6938518346b23bbb984b81f0bbb84e5c656fba61a63054

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=56
    - setuptools-scm >=3.4.1
    - pip
  run:
    - python >={{ python_min }}
    - jaraco.functools
    - jaraco.context
    - jaraco.collections

test:
  imports:
    - jaraco.test
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/jaraco/jaraco.test
  summary: Testing support by jaraco
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jan-janssen
